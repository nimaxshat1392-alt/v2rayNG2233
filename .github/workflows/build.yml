name: Build Fast VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old Kotlin files
        run: |
          JAVA="V2rayNG/app/src/main/java/com/v2ray/ang"
          rm -rf "$JAVA/ui/home" 2>/dev/null || true
          rm -rf "$JAVA/ui/admin" 2>/dev/null || true
          rm -rf "$JAVA/ui/components" 2>/dev/null || true
          rm -rf "$JAVA/worker" 2>/dev/null || true
          rm -rf "$JAVA/widget" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/VpnTheme.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/ThemeAdvanced.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/TypographyConfig.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/ColorPalette.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigUpdater.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/PingManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigParser.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ServersRepository.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ServerRepository.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/VpnConnectionManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/VpnNotificationManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/LanguageManager.kt" 2>/dev/null || true
          rm -f "$JAVA/util/NotificationChannelHelper.kt" 2>/dev/null || true
          rm -f "$JAVA/util/PreferencesManager.kt" 2>/dev/null || true
          echo "=== Cleanup complete ==="

      - name: Restore original v2rayNG core files
        run: |
          JAVA="V2rayNG/app/src/main/java/com/v2ray/ang"
          mkdir -p "$JAVA/handler"
          mkdir -p "$JAVA/service"

          # دانلود SpeedtestManager.kt اصلی از مخزن 2dust
          echo "=== Downloading original SpeedtestManager.kt ==="
          curl -L -s -o "$JAVA/handler/SpeedtestManager.kt" \
            "https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/src/main/java/com/v2ray/ang/handler/SpeedtestManager.kt" \
            || echo "download failed"

          # اگر دانلود موفق نبود، نسخه ساده بساز
          if [ ! -s "$JAVA/handler/SpeedtestManager.kt" ] || ! grep -q "object SpeedtestManager" "$JAVA/handler/SpeedtestManager.kt"; then
            echo "=== Creating minimal SpeedtestManager ==="
            cat > "$JAVA/handler/SpeedtestManager.kt" << 'KTEOF'
package com.v2ray.ang.handler

import com.v2ray.ang.dto.entities.ProfileItem

object SpeedtestManager {
    fun getRealPingTime(guid: String): Long = 0L
    fun getRealPingTime(guid: String, onResult: (Long) -> Unit) {
        onResult(0L)
    }
    suspend fun testAllServersPing(servers: List<ProfileItem>) = Unit
}
KTEOF
          fi

          echo "=== SpeedtestManager.kt status ==="
          wc -l "$JAVA/handler/SpeedtestManager.kt"

      - name: Reset AndroidManifest
        run: |
          MF="V2rayNG/app/src/main/AndroidManifest.xml"
          python3 << 'PYEOF'
          import re
          path = "V2rayNG/app/src/main/AndroidManifest.xml"
          with open(path) as f: c = f.read()

          for name in ["HomeActivity", "AdminPanelActivity", "SettingsActivity",
                       "SpeedTestActivity", "AboutActivity", "CountryListActivity",
                       "ServerListActivity", "DataUsageActivity", "BackupRestoreActivity",
                       "KillSwitchActivity", "SplitTunnelActivity", "DnsSettingsActivity",
                       "RoutingActivity", "ProxySettingsActivity", "FirstRunActivity",
                       "SplashActivity", "HelpActivity", "LegalActivity", "AboutNewActivity",
                       "QrScannerActivity"]:
              c = re.sub(rf'<activity[^>]*android:name="[^"]*\.{name}"[^>]*>.*?</activity>', '', c, flags=re.DOTALL)
              c = re.sub(rf'<activity[^>]*android:name="[^"]*\.{name}"[^>]*/>', '', c)
              c = re.sub(rf'<receiver[^>]*android:name="[^"]*\.{name}"[^>]*>.*?</receiver>', '', c, flags=re.DOTALL)

          c = c.replace('android:enabled="false" android:exported="false" android:name=".ui.main.MainActivity"',
                        'android:name=".ui.main.MainActivity"')

          if 'android.intent.category.LAUNCHER' not in c:
              c = re.sub(
                  r'(<activity[^>]*android:name="\.ui\.main\.MainActivity"[^>]*>)',
                  r'\1\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>',
                  c, count=1
              )

          with open(path, "w") as f: f.write(c)
          print("Manifest reset done")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "failed"
          ls -la

      - name: Add Compose deps
        run: |
          F="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$F"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")\n    implementation("androidx.compose.animation:animation:1.7.6")|' "$F"
          fi
          echo "Compose deps added"

      - name: Limit to arm64-v8a
        run: |
          F="V2rayNG/app/build.gradle.kts"
          python3 -c "
          import re
          c = open('$F').read()
          if 'abiFilters' not in c:
              c = re.sub(r'(defaultConfig\s*\{)', r'\1\n        ndk { abiFilters.add(\"arm64-v8a\") }', c, count=1)
          open('$F', 'w').write(c)
          print('ABI limited to arm64-v8a')
          "

      - name: Run generate script
        run: python3 scripts/generate.py

      - name: Run fixer (self-healing)
        run: python3 scripts/fixer.py
        continue-on-error: true

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build APK - Attempt 1
        id: build1
        continue-on-error: true
        run: |
          cd V2rayNG
          ./gradlew assembleFossDebug --stacktrace

      - name: Show errors if failed
        if: steps.build1.outcome == 'failure'
        run: |
          echo "=== First build failed, showing errors ==="
          cd V2rayNG
          ./gradlew assembleFossDebug --stacktrace 2>&1 | grep -E "^e:|error:|FAILURE|What went wrong" | head -50 || true

      - name: Build APK - Attempt 2 (fallback)
        if: steps.build1.outcome == 'failure'
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: List all APKs
        if: always()
        run: |
          echo "=== APK files found ==="
          find V2rayNG/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 9
