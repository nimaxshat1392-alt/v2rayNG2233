name: Build VPN APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Patch from MASTER_FIX_GUIDE.txt
        run: |
          python3 << 'PYEOF'
          import re, os

          with open('MASTER_FIX_GUIDE.txt', 'r', encoding='utf-8') as f:
              content = f.read()

          sep = '═' * 60
          parts = content.split(sep)
          created = 0

          for i in range(1, len(parts) - 1, 2):
              header = parts[i]
              body = parts[i + 1]

              mp = re.search(r'مسیر:\s*(.+)', header)
              mf = re.search(r'نام فایل:\s*(.+)', header)
              if not mp or not mf:
                  continue

              path = mp.group(1).strip()
              filename = mf.group(1).strip()

              if not path.startswith('V2rayNG/'):
                  continue
              if not (filename.endswith('.kt') or filename.endswith('.xml') or filename.endswith('.kts')):
                  continue

              lines = body.split('\n')
              start_idx = None
              for idx, line in enumerate(lines):
                  s = line.strip()
                  if s.startswith('package') or s.startswith('<?xml') or s.startswith('import'):
                      start_idx = idx
                      break
              if start_idx is None:
                  continue

              code = '\n'.join(lines[start_idx:]).rstrip()
              if len(code) < 100:
                  continue

              full = os.path.join(path, filename)
              os.makedirs(os.path.dirname(full), exist_ok=True)
              with open(full, 'w', encoding='utf-8') as f:
                  f.write(code)
              created += 1
              print(f'✓ {full}')

          print(f'\n✓ {created} files created from guide')
          PYEOF

      - name: Update AndroidManifest.xml
        run: |
          MF="V2rayNG/app/src/main/AndroidManifest.xml"
          if ! grep -q "AdminPanelActivity" "$MF"; then
            sed -i 's|</application>|    <activity android:name=".ui.admin.AdminPanelActivity" android:exported="false" android:label="Admin Panel" />\n    </application>|' "$MF"
          fi
          echo "✓ Manifest updated"

      - name: Create configs.json if missing
        run: |
          if [ ! -f "configs.json" ]; then
            echo '["vless://4bdeee92-97e8-414d-bef6-ec1d5e2ab73b@5.157.10.148:443?security=reality&encryption=none&pbk=x6p656szvu_3CKLsJ4NtkooRvdTVGx7IoPca_p58_jA&headerType=none&fp=chrome&type=tcp&flow=xtls-rprx-vision&sni=surstreming.vvzzkontaktezzvv.garden&sid=fb442438e2223836#mlmvpn2570"]' > configs.json
          fi
          echo "✓ configs.json ready"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-apk
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
