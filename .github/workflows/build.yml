name: Build Fast VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "failed"

      - name: Add Compose deps
        run: |
          F="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$F"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")\n    implementation("androidx.compose.animation:animation:1.7.6")|' "$F"
          fi

      - name: Run ultimate fix
        run: python3 scripts/ultimate_fix.py
        continue-on-error: true

      - name: List APKs
        if: always()
        run: |
          echo "=== APK files ==="
          find V2rayNG/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || echo "no APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 9
