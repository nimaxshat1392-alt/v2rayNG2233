name: Build Fast VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old files
        run: |
          JAVA="V2rayNG/app/src/main/java/com/v2ray/ang"
          rm -rf "$JAVA/ui/home" "$JAVA/ui/admin" "$JAVA/ui/components" "$JAVA/worker" "$JAVA/widget" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/VpnTheme.kt" "$JAVA/ui/theme/ThemeAdvanced.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/TypographyConfig.kt" "$JAVA/ui/theme/ColorPalette.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigUpdater.kt" "$JAVA/handler/PingManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigParser.kt" "$JAVA/handler/ServersRepository.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/VpnConnectionManager.kt" "$JAVA/handler/VpnNotificationManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/LanguageManager.kt" "$JAVA/util/NotificationChannelHelper.kt" 2>/dev/null || true
          rm -f "$JAVA/util/PreferencesManager.kt" 2>/dev/null || true
          echo "Cleanup done"

      - name: Restore SpeedtestManager.kt
        run: |
          mkdir -p V2rayNG/app/src/main/java/com/v2ray/ang/handler
          printf '%s\n' \
            'package com.v2ray.ang.handler' \
            '' \
            'import com.v2ray.ang.dto.entities.ProfileItem' \
            '' \
            'object SpeedtestManager {' \
            '    fun getRealPingTime(guid: String): Long = 0L' \
            '    fun getRealPingTime(guid: String, onResult: (Long) -> Unit) {' \
            '        onResult(0L)' \
            '    }' \
            '    suspend fun testAllServersPing(servers: List<ProfileItem>) = Unit' \
            '}' \
            > V2rayNG/app/src/main/java/com/v2ray/ang/handler/SpeedtestManager.kt
          echo "SpeedtestManager restored"
          cat V2rayNG/app/src/main/java/com/v2ray/ang/handler/SpeedtestManager.kt

      - name: Reset AndroidManifest
        run: |
          python3 -c "
          import re
          path = 'V2rayNG/app/src/main/AndroidManifest.xml'
          c = open(path).read()
          names = ['HomeActivity','AdminPanelActivity','SettingsActivity','SpeedTestActivity','AboutActivity','CountryListActivity','ServerListActivity','DataUsageActivity','BackupRestoreActivity','KillSwitchActivity','SplitTunnelActivity','DnsSettingsActivity','RoutingActivity','ProxySettingsActivity','FirstRunActivity','SplashActivity','HelpActivity','LegalActivity','AboutNewActivity','QrScannerActivity']
          for name in names:
              c = re.sub(r'<activity[^>]*android:name=\"[^\"]*\.' + name + r'\"[^>]*>.*?</activity>', '', c, flags=re.DOTALL)
              c = re.sub(r'<activity[^>]*android:name=\"[^\"]*\.' + name + r'\"[^>]*/>', '', c)
              c = re.sub(r'<receiver[^>]*android:name=\"[^\"]*\.' + name + r'\"[^>]*>.*?</receiver>', '', c, flags=re.DOTALL)
          c = c.replace('android:enabled=\"false\" android:exported=\"false\" android:name=\".ui.main.MainActivity\"', 'android:name=\".ui.main.MainActivity\"')
          if 'android.intent.category.LAUNCHER' not in c:
              c = re.sub(r'(<activity[^>]*android:name=\"\.ui\.main\.MainActivity\"[^>]*>)', r'\1\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>', c, count=1)
          open(path, 'w').write(c)
          print('Manifest reset done')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "failed"
          ls -la

      - name: Add Compose deps
        run: |
          F="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$F"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")\n    implementation("androidx.compose.animation:animation:1.7.6")|' "$F"
          fi
          echo "Compose deps added"

      - name: Limit to arm64-v8a
        run: |
          F="V2rayNG/app/build.gradle.kts"
          python3 -c "
          import re
          c = open('$F').read()
          if 'abiFilters' not in c:
              c = re.sub(r'(defaultConfig\s*\{)', r'\1\n        ndk { abiFilters.add(\"arm64-v8a\") }', c, count=1)
          open('$F', 'w').write(c)
          print('ABI limited')
          "

      - name: Run generate script
        run: python3 scripts/generate.py

      - name: Run fixer
        run: python3 scripts/fixer.py
        continue-on-error: true

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build APK - Attempt 1
        id: build1
        continue-on-error: true
        run: |
          cd V2rayNG
          ./gradlew assembleFossDebug --stacktrace

      - name: Show errors if failed
        if: steps.build1.outcome == 'failure'
        run: |
          echo "=== Build failed. Errors: ==="
          cd V2rayNG
          ./gradlew assembleFossDebug --stacktrace 2>&1 | grep -E "^e:|error:|FAILURE|What went wrong" | head -50 || true

      - name: Build APK - Attempt 2 (fallback)
        if: steps.build1.outcome == 'failure'
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: List all APKs
        if: always()
        run: |
          echo "=== APK files ==="
          find V2rayNG/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 9
