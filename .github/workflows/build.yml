name: Build Pro VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "download failed"
          ls -la

      - name: Add Compose dependencies
        run: |
          BUILD_FILE="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$BUILD_FILE"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")\n    implementation("androidx.compose.animation:animation:1.7.6")|' "$BUILD_FILE"
          fi

      - name: Run patch script
        run: python3 scripts/patch.py

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pro-vpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
