name: Build Pro VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old files
        run: |
          echo "=== Removing old files ==="

          # حذف فایل‌های راهنما و اسکریپت‌های قدیمی
          rm -f MASTER_FIX_GUIDE.txt 2>/dev/null || true
          rm -f scripts/patch.py 2>/dev/null || true
          rm -f scripts/generate_old.py 2>/dev/null || true

          # حذف ورک‌فلوهای قدیمی
          rm -f .github/workflows/auto-build-vpn.yml 2>/dev/null || true
          rm -f .github/workflows/fix.yml 2>/dev/null || true
          rm -f .github/workflows/build-old.yml 2>/dev/null || true

          # حذف فایل‌های Kotlin که ممکنه خراب باشن
          JAVA="V2rayNG/app/src/main/java/com/v2ray/ang"
          rm -rf "$JAVA/ui/home" 2>/dev/null || true
          rm -rf "$JAVA/ui/admin" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/VpnTheme.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigUpdater.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/dashboard/ModernDashboard.kt" 2>/dev/null || true
          rm -rf "$JAVA/ui/components" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/SettingsScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/SplitTunnelingScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/AdvancedSettings.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/ThemeSelector.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/FAQScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/SupportCard.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/settings/DataUsageScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/SpeedtestManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/SpeedHistoryManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/AppUpdateChecker.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/SubscriptionManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/SavedProfilesManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/BackupManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/RoutingRules.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/PingManager.kt" 2>/dev/null || true
          rm -f "$JAVA/handler/DataUsage.kt" 2>/dev/null || true
          rm -f "$JAVA/util/ModernNotification.kt" 2>/dev/null || true
          rm -f "$JAVA/util/CrashReporter.kt" 2>/dev/null || true
          rm -f "$JAVA/util/NetworkChecker.kt" 2>/dev/null || true
          rm -f "$JAVA/util/Logger.kt" 2>/dev/null || true
          rm -f "$JAVA/util/DataManager.kt" 2>/dev/null || true
          rm -f "$JAVA/receiver/BootReceiver.kt" 2>/dev/null || true
          rm -f "$JAVA/service/VpnTileService.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/ConnectionStatus.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/UpdateDialog.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/RatingDialog.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/TrafficGraph.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/ConnectionCard.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/components/InAppMessages.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/SplashActivity.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/WelcomeScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/TutorialScreen.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/widget/VpnWidgetProvider.kt" 2>/dev/null || true

          echo "=== Cleanup done ==="
          ls -la scripts/ 2>/dev/null || echo "scripts folder not found"
          ls -la .github/workflows/ 2>/dev/null

      - name: Reset AndroidManifest
        run: |
          echo "=== Resetting AndroidManifest.xml ==="
          MF="V2rayNG/app/src/main/AndroidManifest.xml"

          python3 << 'PYEOF'
          import re
          path = "V2rayNG/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              c = f.read()

          # حذف HomeActivity، AdminPanelActivity، SettingsActivity، ProBootReceiver، VpnTileService
          c = re.sub(r'<activity[^>]*android:name="\.ui\.home\.HomeActivity"[^>]*>.*?</activity>', '', c, flags=re.DOTALL)
          c = re.sub(r'<activity[^>]*android:name="\.ui\.admin\.AdminPanelActivity"[^>]*/>', '', c)
          c = re.sub(r'<activity[^>]*android:name="\.ui\.settings\.SettingsActivity"[^>]*/>', '', c)
          c = re.sub(r'<receiver[^>]*android:name="\.receiver\.ProBootReceiver"[^>]*>.*?</receiver>', '', c, flags=re.DOTALL)
          c = re.sub(r'<service[^>]*android:name="\.service\.VpnTileService"[^>]*>.*?</service>', '', c, flags=re.DOTALL)
          c = re.sub(r'<uses-permission[^>]*android:name="android\.permission\.RECEIVE_BOOT_COMPLETED"[^>]*/>', '', c)

          # برگرداندن MainActivity به حالت اصلی (اگه غیرفعال شده بود)
          c = c.replace('android:enabled="false" android:exported="false" android:name=".ui.main.MainActivity"',
                        'android:name=".ui.main.MainActivity"')

          # اگه launcher حذف شده، به MainActivity برگردون
          if 'android.intent.category.LAUNCHER' not in c:
              c = re.sub(
                  r'(<activity[^>]*android:name="\.ui\.main\.MainActivity"[^>]*>)',
                  r'\1\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>',
                  c, count=1
              )

          with open(path, "w") as f:
              f.write(c)
          print("Manifest reset done")
          PYEOF

      - name: Reset strings.xml
        run: |
          STRINGS="V2rayNG/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">v2rayNG</string>|' "$STRINGS"
          fi
          echo "strings.xml reset"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "download failed"
          ls -la

      - name: Add Compose deps
        run: |
          F="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$F"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")\n    implementation("androidx.compose.animation:animation:1.7.6")|' "$F"
          fi
          echo "Compose deps added"

      - name: Limit ABIs to arm64-v8a
        run: |
          F="V2rayNG/app/build.gradle.kts"
          python3 -c "
          import re
          c = open('$F').read()
          if 'abiFilters' not in c:
              c = re.sub(r'(defaultConfig\s*\{)', r'\1\n        ndk { abiFilters.add(\"arm64-v8a\") }', c, count=1)
          open('$F', 'w').write(c)
          print('ABI limited to arm64-v8a')
          "

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build APK (baseline - no patches yet)
        run: |
          cd V2rayNG
          ./gradlew assembleFossDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          compression-level: 9
