name: Build Fast VPN

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cleanup old files
        run: |
          JAVA="V2rayNG/app/src/main/java/com/v2ray/ang"
          rm -rf "$JAVA/ui/home" "$JAVA/ui/admin" "$JAVA/ui/components" 2>/dev/null || true
          rm -f "$JAVA/handler/ConfigUpdater.kt" 2>/dev/null || true
          rm -f "$JAVA/ui/theme/VpnTheme.kt" 2>/dev/null || true
          rm -f scripts/generate.py 2>/dev/null || true
          echo "Cleanup done"

      - name: Create SpeedtestManager
        run: |
          mkdir -p V2rayNG/app/src/main/java/com/v2ray/ang/handler
          cat > V2rayNG/app/src/main/java/com/v2ray/ang/handler/SpeedtestManager.kt << 'ENDOFKOTLIN'
package com.v2ray.ang.handler

import com.v2ray.ang.dto.entities.ProfileItem
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.net.InetSocketAddress
import java.net.Socket

data class RemoteIPInfo(
    val ipAddress: String = "",
    val country: String = ""
)

object SpeedtestManager {

    fun socketConnectTime(address: String, port: Int): Long {
        return try {
            val start = System.currentTimeMillis()
            val socket = Socket()
            socket.connect(InetSocketAddress(address, port), 2000)
            val end = System.currentTimeMillis()
            socket.close()
            end - start
        } catch (e: Exception) { -1L }
    }

    suspend fun getRemoteIPInfo(): RemoteIPInfo = withContext(Dispatchers.IO) {
        try {
            val url = java.net.URL("https://api.ipify.org?format=json")
            val conn = url.openConnection() as java.net.HttpURLConnection
            conn.connectTimeout = 10000
            conn.readTimeout = 10000
            val response = conn.inputStream.bufferedReader().readText()
            val ip = Regex("\"ip\"\\s*:\\s*\"([^\"]+)\"").find(response)?.groupValues?.get(1) ?: ""
            RemoteIPInfo(ipAddress = ip, country = "")
        } catch (e: Exception) {
            RemoteIPInfo()
        }
    }

    fun getRealPingTime(guid: String): Long = 0L

    fun getRealPingTime(guid: String, onResult: (Long) -> Unit) {
        onResult(0L)
    }

    suspend fun testAllServersPing(servers: List<ProfileItem>) = Unit
}
ENDOFKOTLIN
          echo "SpeedtestManager created"

      - name: Download libv2ray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          cd V2rayNG/app/libs
          curl -L -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" || echo "failed"

      - name: Add Compose deps
        run: |
          F="V2rayNG/app/build.gradle.kts"
          if ! grep -q "material-icons-extended" "$F"; then
            sed -i 's|dependencies {|dependencies {\n    implementation("androidx.compose.material:material-icons-extended")|' "$F"
          fi

      - name: Limit to arm64-v8a
        run: |
          F="V2rayNG/app/build.gradle.kts"
          python3 -c "
          import re
          c = open('$F').read()
          if 'abiFilters' not in c:
              c = re.sub(r'(defaultConfig\s*\{)', r'\1\n        ndk { abiFilters.add(\"arm64-v8a\") }', c, count=1)
          open('$F', 'w').write(c)
          "

      - name: Build APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: List APKs
        if: always()
        run: |
          find V2rayNG/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || echo "no APK"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-vpn-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
