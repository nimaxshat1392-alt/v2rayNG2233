name: Build VPN APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create All Files
        run: |
          BASE="$GITHUB_WORKSPACE/V2rayNG/app/src/main"
          JAVA="$BASE/java/com/v2ray/ang"
          mkdir -p "$JAVA/ui/admin"
          mkdir -p "$JAVA/ui/theme_new"
          mkdir -p "$JAVA/ui/components"
          mkdir -p "$JAVA/handler"

          # ConfigUpdater.kt
          if [ ! -f "$JAVA/handler/ConfigUpdater.kt" ]; then
          cat > "$JAVA/handler/ConfigUpdater.kt" << 'KTEOF'
          package com.v2ray.ang.handler

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL

          object ConfigUpdater {
              private const val CONFIG_URL = "https://raw.githubusercontent.com/nimaxshat1392-alt/v2rayNG2233/master/configs.json"

              suspend fun fetchRemoteConfigs(): List<String> = withContext(Dispatchers.IO) {
                  try {
                      val conn = URL(CONFIG_URL).openConnection() as HttpURLConnection
                      conn.connectTimeout = 15000
                      conn.readTimeout = 15000
                      val resp = conn.inputStream.bufferedReader().readText()
                      val arr = JSONArray(resp)
                      val list = mutableListOf<String>()
                      for (i in 0 until arr.length()) list.add(arr.getString(i))
                      list
                  } catch (e: Exception) { emptyList() }
              }
          }
          KTEOF
          fi

          # AdminPanelActivity.kt
          if [ ! -f "$JAVA/ui/admin/AdminPanelActivity.kt" ]; then
          cat > "$JAVA/ui/admin/AdminPanelActivity.kt" << 'KTEOF'
          package com.v2ray.ang.ui.admin

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import com.v2ray.ang.handler.ConfigUpdater
          import kotlinx.coroutines.launch

          class AdminPanelActivity : ComponentActivity() {
              private val ADMIN_PASSWORD = "poiiu"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          var auth by remember { mutableStateOf(false) }
                          if (!auth) AdminLogin { auth = true } else AdminContent()
                      }
                  }
              }

              @Composable private fun AdminLogin(onOk: () -> Unit) {
                  var pass by remember { mutableStateOf("") }
                  var err by remember { mutableStateOf(false) }
                  Column(Modifier.fillMaxSize().padding(32.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center) {
                      Text("ورود مدیر", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(24.dp))
                      OutlinedTextField(pass, { pass = it; err = false },
                          label = { Text("رمز عبور") },
                          visualTransformation = PasswordVisualTransformation(),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                          isError = err, singleLine = true)
                      if (err) Text("رمز اشتباه", color = MaterialTheme.colorScheme.error)
                      Spacer(Modifier.height(16.dp))
                      Button({ if (pass == ADMIN_PASSWORD) onOk() else err = true },
                          Modifier.fillMaxWidth()) { Text("ورود") }
                  }
              }

              @Composable fun AdminContent() {
                  val scope = rememberCoroutineScope()
                  var updating by remember { mutableStateOf(false) }
                  var status by remember { mutableStateOf("") }
                  Column(Modifier.padding(16.dp)) {
                      Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp)) {
                          Column(Modifier.padding(16.dp)) {
                              Text("پنل مدیریت", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                              if (status.isNotEmpty()) {
                                  Spacer(Modifier.height(8.dp))
                                  Text(status, style = MaterialTheme.typography.bodySmall)
                              }
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                      Button({
                          updating = true
                          status = "در حال دریافت..."
                          scope.launch {
                              val r = ConfigUpdater.fetchRemoteConfigs()
                              status = if (r.isNotEmpty()) "دریافت ${r.size} کانفیگ موفق" else "خطا در دریافت"
                              updating = false
                          }
                      }, Modifier.fillMaxWidth(), enabled = !updating) {
                          Icon(Icons.Default.Refresh, null); Spacer(Modifier.width(8.dp))
                          Text(if (updating) "..." else "آپدیت کانفیگ")
                      }
                  }
              }
          }
          KTEOF
          fi

          # ThemeAdvanced.kt
          if [ ! -f "$JAVA/ui/theme_new/ThemeAdvanced.kt" ]; then
          cat > "$JAVA/ui/theme_new/ThemeAdvanced.kt" << 'KTEOF'
          package com.v2ray.ang.ui.theme_new

          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.ui.graphics.Color

          val AmoledColors = darkColorScheme(
              primary = Color(0xFF00E5FF),
              background = Color(0xFF000000),
              surface = Color(0xFF0A0A0A),
              onBackground = Color(0xFFE0E0E0),
              onSurface = Color(0xFFE0E0E0)
          )

          val CyberpunkColors = darkColorScheme(
              primary = Color(0xFFFF00FF),
              secondary = Color(0xFF00FFFF),
              background = Color(0xFF0D0221),
              surface = Color(0xFF1A0B2E)
          )

          val LightMinimal = lightColorScheme(
              primary = Color(0xFF2E7D32),
              background = Color(0xFFF5F5F5),
              surface = Color(0xFFFFFFFF)
          )
          KTEOF
          fi

          # ConnectionCard.kt
          if [ ! -f "$JAVA/ui/components/ConnectionCard.kt" ]; then
          cat > "$JAVA/ui/components/ConnectionCard.kt" << 'KTEOF'
          package com.v2ray.ang.ui.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Security
          import androidx.compose.material.icons.filled.Speed
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp

          @Composable
          fun ConnectionCard(name: String, flag: String, protocol: String, ping: String, connected: Boolean) {
              val grad = if (connected) Brush.horizontalGradient(listOf(Color(0xFF1E3A8A), Color(0xFF3B82F6)))
                         else Brush.horizontalGradient(listOf(Color(0xFF374151), Color(0xFF6B7280)))
              Card(Modifier.fillMaxWidth().padding(16.dp), shape = RoundedCornerShape(24.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.Transparent)) {
                  Box(Modifier.fillMaxWidth().background(grad).padding(20.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Surface(Modifier.size(56.dp), shape = RoundedCornerShape(16.dp),
                              color = Color.White.copy(alpha = 0.2f)) {
                              Box(Alignment.Center) { Text(flag, style = MaterialTheme.typography.headlineMedium) }
                          }
                          Spacer(Modifier.width(16.dp))
                          Column(Modifier.weight(1f)) {
                              Text(name, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold, color = Color.White)
                              Row {
                                  Icon(Icons.Default.Security, null, tint = Color.White.copy(alpha = 0.7f), modifier = Modifier.size(16.dp))
                                  Text(" $protocol", color = Color.White.copy(alpha = 0.7f))
                                  Spacer(Modifier.width(12.dp))
                                  Icon(Icons.Default.Speed, null, tint = Color.White.copy(alpha = 0.7f), modifier = Modifier.size(16.dp))
                                  Text(" $ping", color = Color.White.copy(alpha = 0.7f))
                              }
                          }
                      }
                  }
              }
          }
          KTEOF
          fi

      - name: Add Admin to Manifest
        run: |
          MF="$GITHUB_WORKSPACE/V2rayNG/app/src/main/AndroidManifest.xml"
          if ! grep -q "AdminPanelActivity" "$MF"; then
            sed -i 's|</application>|    <activity android:name=".ui.admin.AdminPanelActivity" android:exported="false" android:label="Admin" />\n    </application>|' "$MF"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x V2rayNG/gradlew

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-apk
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
