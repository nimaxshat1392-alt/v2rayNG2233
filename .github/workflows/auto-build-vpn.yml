// ════════════════════════════════════════════════════════════════

val AmoledBlackColors = darkColorScheme(
    primary = Color(0xFF00E5FF),
    onPrimary = Color(0xFF000000),
    primaryContainer = Color(0xFF00363D),
    onPrimaryContainer = Color(0xFF00E5FF),
    secondary = Color(0xFFB388FF),
    background = Color(0xFF000000),
    surface = Color(0xFF0A0A0A),
    onBackground = Color(0xFFE0E0E0),
    onSurface = Color(0xFFE0E0E0),
    error = Color(0xFFFF5252),
    outline = Color(0xFF333333)
)

val CyberpunkColors = darkColorScheme(
    primary = Color(0xFFFF00FF),
    onPrimary = Color(0xFF000000),
    secondary = Color(0xFF00FFFF),
    background = Color(0xFF0D0221),
    surface = Color(0xFF1A0B2E),
    onBackground = Color(0xFFE0E0E0),
    onSurface = Color(0xFFE0E0E0),
    error = Color(0xFFFF0040)
)

val MinimalLightColors = lightColorScheme(
    primary = Color(0xFF2E7D32),
    onPrimary = Color(0xFFFFFFFF),
    background = Color(0xFFF5F5F5),
    surface = Color(0xFFFFFFFF),
    onBackground = Color(0xFF212121),
    onSurface = Color(0xFF212121),
    error = Color(0xFFD32F2F)
)

val ProfessionalDarkColors = darkColorScheme(
    primary = Color(0xFF64B5F6),
    onPrimary = Color(0xFF000000),
    background = Color(0xFF121212),
    surface = Color(0xFF1E1E1E),
    onBackground = Color(0xFFE0E0E0),
    onSurface = Color(0xFFE0E0E0),
    error = Color(0xFFEF5350)
)

// ════════════════════════════════════════════════════════════════
// تابع اصلی تم با پشتیبانی از حالت‌های مختلف
// ════════════════════════════════════════════════════════════════

@Composable
fun VpnTheme(
    darkTheme: Boolean = isSystemInDarkTheme(),
    themeMode: String = "auto", // "auto", "light", "dark", "amoled", "cyberpunk"
    content: @Composable () -> Unit
) {
    val colorScheme = when (themeMode) {
        "light" -> MinimalLightColors
        "dark" -> ProfessionalDarkColors
        "amoled" -> AmoledBlackColors
        "cyberpunk" -> CyberpunkColors
        else -> if (darkTheme) ProfessionalDarkColors else MinimalLightColors
    }

    MaterialTheme(
        colorScheme = colorScheme,
        typography = Typography,
        content = content
    )
}

