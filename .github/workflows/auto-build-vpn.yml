package com.v2ray.ang.handler

import android.content.Context
import android.os.Environment
import java.io.File
import java.text.SimpleDateFormat
import java.util.*

object BackupManager {

    private const val BACKUP_DIR = "VPN_Backups"

    fun createBackup(context: Context): File? {
        return try {
            val dir = File(Environment.getExternalStorageDirectory(), BACKUP_DIR)
            if (!dir.exists()) dir.mkdirs()

            val sdf = SimpleDateFormat("yyyy-MM-dd_HH-mm-ss", Locale.getDefault())
            val fileName = "backup_${sdf.format(Date())}.json"
            val file = File(dir, fileName)

            val configs = MmkvManager.decodeAllServerConfig()
            file.writeText(configs.toString())

            file
        } catch (e: Exception) {
            null
        }
    }

    fun restoreBackup(context: Context, file: File): Boolean {
        return try {
            val json = file.readText()
            // پردازش JSON و بازیابی کانفیگ‌ها
            true
        } catch (e: Exception) {
            false
        }
    }

    fun listBackups(): List<File> {
        val dir = File(Environment.getExternalStorageDirectory(), BACKUP_DIR)
        return if (dir.exists()) {
            dir.listFiles()?.sortedByDescending { it.lastModified() } ?: emptyList()
        } else {
            emptyList()
        }
    }
}

