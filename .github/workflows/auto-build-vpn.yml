package com.v2ray.ang.ui.components

import androidx.compose.animation.animateColorAsState
import androidx.compose.animation.core.*
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.CircleShape
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp

enum class VpnStatus {
    DISCONNECTED, CONNECTING, CONNECTED, DISCONNECTING, ERROR
}

@Composable
fun ConnectionStatusBadge(status: VpnStatus) {
    val color by animateColorAsState(
        targetValue = when (status) {
            VpnStatus.DISCONNECTED -> Color(0xFF6B7280)
            VpnStatus.CONNECTING -> Color(0xFFF59E0B)
            VpnStatus.CONNECTED -> Color(0xFF10B981)
            VpnStatus.DISCONNECTING -> Color(0xFFF59E0B)
            VpnStatus.ERROR -> Color(0xFFEF4444)
        },
        animationSpec = tween(500),
        label = "status_color"
    )

    val text = when (status) {
        VpnStatus.DISCONNECTED -> "قطع"
        VpnStatus.CONNECTING -> "در حال اتصال..."
        VpnStatus.CONNECTED -> "متصل"
        VpnStatus.DISCONNECTING -> "در حال قطع..."
        VpnStatus.ERROR -> "خطا"
    }

    Surface(
        shape = RoundedCornerShape(20.dp),
        color = color.copy(alpha = 0.2f)
    ) {
        Row(
            modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            if (status == VpnStatus.CONNECTING || status == VpnStatus.DISCONNECTING) {
                CircularProgressIndicator(
                    modifier = Modifier.size(12.dp),
                    strokeWidth = 2.dp,
                    color = color
                )
            } else {
                Box(
                    modifier = Modifier
                        .size(10.dp)
                        .background(color, CircleShape)
                )
            }
            Spacer(modifier = Modifier.width(8.dp))
            Text(
                text,
                style = MaterialTheme.typography.labelLarge,
                color = color,
                fontWeight = FontWeight.Bold
            )
        }
    }
}

