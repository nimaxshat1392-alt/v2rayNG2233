import androidx.compose.ui.unit.dp

data class ThemeOption(
    val id: String,
    val name: String,
    val description: String,
    val color: Color
)

@Composable
fun ThemeSelector(
    currentTheme: String,
    onThemeSelected: (String) -> Unit
) {
    val themes = listOf(
        ThemeOption("auto", "خودکار", "پیروی از سیستم", Color(0xFF607D8B)),
        ThemeOption("light", "روشن", "مینیمال و ساده", Color(0xFF4CAF50)),
        ThemeOption("dark", "تاریک", "حرفه‌ای", Color(0xFF263238)),
        ThemeOption("amoled", "AMOLED", "مشکی مطلق، صرفه‌جویی باتری", Color(0xFF000000)),
        ThemeOption("cyberpunk", "سایبرپانک", "نئون و مدرن", Color(0xFFFF00FF))
    )

    LazyColumn(
        modifier = Modifier
            .fillMaxWidth()
            .padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(8.dp)
    ) {
        item {
            Text(
                "انتخاب تم",
                style = MaterialTheme.typography.headlineMedium,
                fontWeight = FontWeight.Bold
            )
            Spacer(modifier = Modifier.height(8.dp))
        }

        items(themes) { theme ->
            Card(
                modifier = Modifier
                    .fillMaxWidth()
                    .clickable { onThemeSelected(theme.id) },
                shape = RoundedCornerShape(16.dp),
                colors = CardDefaults.cardColors(
                    containerColor = if (currentTheme == theme.id)
                        MaterialTheme.colorScheme.primaryContainer
                    else
                        MaterialTheme.colorScheme.surfaceVariant
                )
            ) {
                Row(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(16.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Box(
                        modifier = Modifier
                            .size(48.dp)
                            .clip(RoundedCornerShape(12.dp))
                            .background(theme.color)
                    )
                    Spacer(modifier = Modifier.width(16.dp))
                    Column(modifier = Modifier.weight(1f)) {
                        Text(
                            theme.name,
                            style = MaterialTheme.typography.bodyLarge,
                            fontWeight = FontWeight.Bold
                        )
                        Text(
                            theme.description,
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                    if (currentTheme == theme.id) {
                        Icon(
                            Icons.Default.Check,
                            contentDescription = "انتخاب شده",
                            tint = MaterialTheme.colorScheme.primary
                        )
                    }
                }
            }
        }
    }
}

