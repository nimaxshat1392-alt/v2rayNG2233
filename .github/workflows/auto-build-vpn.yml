package com.v2ray.ang.handler

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import org.json.JSONArray
import java.net.HttpURLConnection
import java.net.URL

object ConfigUpdater {

    private const val CONFIG_URL =
        "https://raw.githubusercontent.com/nimaxshat1392-alt/v2rayNG2233/main/configs.json"

    suspend fun fetchRemoteConfigs(): List<String> = withContext(Dispatchers.IO) {
        try {
            val url = URL(CONFIG_URL)
            val connection = url.openConnection() as HttpURLConnection
            connection.requestMethod = "GET"
            connection.connectTimeout = 15000
            connection.readTimeout = 15000
            connection.setRequestProperty("User-Agent", "MyVPN/1.0")

            val response = connection.inputStream.bufferedReader().readText()
            val jsonArray = JSONArray(response)
            val configs = mutableListOf<String>()

            for (i in 0 until jsonArray.length()) {
                configs.add(jsonArray.getString(i))
            }
            configs
        } catch (e: Exception) {
            e.printStackTrace()
            emptyList()
        }
    }

    suspend fun updateConfigs(): Boolean = withContext(Dispatchers.IO) {
        val remoteConfigs = fetchRemoteConfigs()
        if (remoteConfigs.isEmpty()) return@withContext false

        MmkvManager.removeServerViaSubid("remote_configs")

        AngConfigManager.importBatchConfig(
            remoteConfigs.joinToString("\n"),
            "remote_configs",
            append = false
        )
        true
    }
}

