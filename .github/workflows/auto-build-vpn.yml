@Composable
fun TutorialScreen() {
    val steps = listOf(
        "مرحله ۱" to "روی دکمه دایره‌ای وسط صفحه ضربه بزنید تا برنامه شروع به جستجوی بهترین سرور کند.",
        "مرحله ۲" to "پس از پیدا شدن سرور، دکمه دایره‌ای سبز می‌شود. یعنی شما به VPN متصل هستید.",
        "مرحله ۳" to "برای قطع اتصال، دوباره روی همان دکمه بزنید تا رنگش به حالت اولیه برگردد.",
        "مرحله ۴" to "برای مشاهده لیست سرورها، به صفحه «سرورها» بروید و سرور مورد نظر را انتخاب کنید.",
        "مرحله ۵" to "در بخش تنظیمات، می‌توانید تم برنامه، اسپلیت تانل و Kill Switch را فعال کنید.",
        "نکته مهم" to "اگر اتصال قطع شد، ابتدا اینترنت خود را بررسی کنید و سپس دکمه اتصال را بزنید."
    )

    LazyColumn(
        modifier = Modifier
            .fillMaxSize()
            .padding(16.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        item {
            Text(
                "راهنمای استفاده",
                style = MaterialTheme.typography.headlineMedium,
                fontWeight = FontWeight.Bold
            )
            Spacer(modifier = Modifier.height(8.dp))
            Text(
                "در ۶ مرحله ساده با برنامه آشنا شوید",
                style = MaterialTheme.typography.bodyMedium,
                color = MaterialTheme.colorScheme.onSurfaceVariant
            )
            Spacer(modifier = Modifier.height(16.dp))
        }

        items(steps) { (title, content) ->
            Card(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(16.dp)
            ) {
                Row(
                    modifier = Modifier.padding(16.dp),
                    verticalAlignment = Alignment.Top
                ) {
                    Surface(
                        modifier = Modifier.size(40.dp),
                        shape = CircleShape,
                        color = MaterialTheme.colorScheme.primaryContainer
                    ) {
                        Box(contentAlignment = Alignment.Center) {
                            Text(
                                title.split(" ").last(),
                                style = MaterialTheme.typography.titleMedium,
                                fontWeight = FontWeight.Bold,
                                color = MaterialTheme.colorScheme.primary
                            )
                        }
                    }
                    Spacer(modifier = Modifier.width(12.dp))
                    Column(modifier = Modifier.weight(1f)) {
                        Text(
                            title,
                            style = MaterialTheme.typography.titleMedium,
                            fontWeight = FontWeight.Bold
                        )
                        Spacer(modifier = Modifier.height(4.dp))
                        Text(
                            content,
                            style = MaterialTheme.typography.bodyMedium,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                }
            }
        }
    }
}

