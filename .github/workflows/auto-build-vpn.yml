class AdminPanelActivity : ComponentActivity() {

    private val ADMIN_PASSWORD = "poiiu"

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme {
                var isAuthenticated by remember { mutableStateOf(false) }

                AnimatedVisibility(
                    visible = !isAuthenticated,
                    enter = fadeIn(tween(500)),
                    exit = fadeOut(tween(500))
                ) {
                    AdminLoginScreen(onLoginSuccess = { isAuthenticated = true })
                }

                AnimatedVisibility(
                    visible = isAuthenticated,
                    enter = fadeIn(tween(500)),
                    exit = fadeOut(tween(500))
                ) {
                    AdminPanelContent()
                }
            }
        }
    }

    @Composable
    private fun AdminLoginScreen(onLoginSuccess: () -> Unit) {
        var password by remember { mutableStateOf("") }
        var error by remember { mutableStateOf(false) }
        var isChecking by remember { mutableStateOf(false) }

        Box(
            modifier = Modifier
                .fillMaxSize()
                .background(MaterialTheme.colorScheme.background),
            contentAlignment = Alignment.Center
        ) {
            Card(
                modifier = Modifier
                    .fillMaxWidth(0.9f)
                    .padding(16.dp),
                shape = RoundedCornerShape(24.dp),
                elevation = CardDefaults.cardElevation(8.dp)
            ) {
                Column(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(32.dp),
                    horizontalAlignment = Alignment.CenterHorizontally
                ) {
                    Surface(
                        modifier = Modifier.size(80.dp),
                        shape = RoundedCornerShape(20.dp),
                        color = MaterialTheme.colorScheme.primaryContainer
                    ) {
                        Box(contentAlignment = Alignment.Center) {
                            Icon(
                                Icons.Default.CheckCircle,
                                contentDescription = null,
                                modifier = Modifier.size(48.dp),
                                tint = MaterialTheme.colorScheme.primary
                            )
                        }
                    }

                    Spacer(modifier = Modifier.height(24.dp))

                    Text(
                        "ورود مدیر",
                        style = MaterialTheme.typography.headlineMedium,
                        fontWeight = FontWeight.Bold
                    )

                    Spacer(modifier = Modifier.height(8.dp))

                    Text(
                        "دسترسی محدود به مدیر سیستم",
                        style = MaterialTheme.typography.bodyMedium,
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )

                    Spacer(modifier = Modifier.height(24.dp))

                    OutlinedTextField(
                        value = password,
                        onValueChange = {
                            password = it
                            error = false
                        },
                        label = { Text("رمز عبور") },
                        visualTransformation = PasswordVisualTransformation(),
                        keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                        singleLine = true,
                        isError = error,
                        modifier = Modifier.fillMaxWidth(),
                        shape = RoundedCornerShape(12.dp),
                        supportingText = if (error) {
                            { Text("رمز عبور اشتباه است", color = MaterialTheme.colorScheme.error) }
                        } else null
                    )

                    Spacer(modifier = Modifier.height(16.dp))

                    Button(
                        onClick = {
                            isChecking = true
                            if (password == ADMIN_PASSWORD) {
                                onLoginSuccess()
                            } else {
                                error = true
                            }
                            isChecking = false
                        },
                        modifier = Modifier
                            .fillMaxWidth()
                            .height(56.dp),
                        shape = RoundedCornerShape(12.dp),
                        enabled = !isChecking
                    ) {
                        if (isChecking) {
                            CircularProgressIndicator(
                                modifier = Modifier.size(20.dp),
                                strokeWidth = 2.dp,
                                color = MaterialTheme.colorScheme.onPrimary
                            )
                        } else {
                            Text("ورود", style = MaterialTheme.typography.titleMedium)
                        }
                    }
                }
            }
        }
    }

    @Composable
    fun AdminPanelContent() {
        val scope = rememberCoroutineScope()
        var configs by remember {
            mutableStateOf(MmkvManager.decodeAllServerConfig().toList())
        }
        var isUpdating by remember { mutableStateOf(false) }
        var pingResult by remember { mutableStateOf<Map<String, Long>>(emptyMap()) }
        var showAddDialog by remember { mutableStateOf(false) }
        var newConfigText by remember { mutableStateOf("") }

        Column(
            modifier = Modifier
                .fillMaxSize()
                .padding(16.dp)
        ) {
            Card(
                modifier = Modifier.fillMaxWidth(),
                shape = RoundedCornerShape(16.dp),
                colors = CardDefaults.cardColors(
                    containerColor = MaterialTheme.colorScheme.primaryContainer
                )
            ) {
                Column(modifier = Modifier.padding(16.dp)) {
                    Text(
                        "پنل مدیریت",
                        style = MaterialTheme.typography.headlineMedium,
                        fontWeight = FontWeight.Bold
                    )
                    Text(
                        "تعداد کانفیگ‌ها: ${configs.size}",
                        style = MaterialTheme.typography.bodyMedium
                    )
                }
            }

            Spacer(modifier = Modifier.height(16.dp))

            Row(
                modifier = Modifier.fillMaxWidth(),
                horizontalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                Button(
                    onClick = {
                        isUpdating = true
                        scope.launch {
                            val success = ConfigUpdater.updateConfigs()
                            if (success) {
                                configs = MmkvManager.decodeAllServerConfig().toList()
                            }
                            isUpdating = false
                        }
                    },
                    modifier = Modifier.weight(1f),
                    enabled = !isUpdating,
                    shape = RoundedCornerShape(12.dp)
                ) {
                    Icon(Icons.Default.Refresh, contentDescription = null)
                    Spacer(modifier = Modifier.width(4.dp))
                    Text(if (isUpdating) "..." else "آپدیت")
                }

                Button(
                    onClick = {
                        scope.launch {
                            val results = mutableMapOf<String, Long>()
                            SpeedtestManager.testAllServersPing(configs) { server, delay ->
                                results[server.guid] = delay
                                pingResult = results.toMap()
                            }
                        }
                    },
                    modifier = Modifier.weight(1f),
                    shape = RoundedCornerShape(12.dp)
                ) {
                    Icon(Icons.Default.Speed, contentDescription = null)
                    Spacer(modifier = Modifier.width(4.dp))
                    Text("پینگ")
                }

                Button(
                    onClick = { showAddDialog = true },
                    modifier = Modifier.weight(1f),
                    shape = RoundedCornerShape(12.dp)
                ) {
                    Icon(Icons.Default.Add, contentDescription = null)
                    Spacer(modifier = Modifier.width(4.dp))
                    Text("افزودن")
                }
            }

            Spacer(modifier = Modifier.height(16.dp))

            LazyColumn(
                verticalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                items(configs) { config ->
                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        shape = RoundedCornerShape(12.dp)
                    ) {
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(12.dp),
                            horizontalArrangement = Arrangement.SpaceBetween,
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Column(modifier = Modifier.weight(1f)) {
                                Text(
                                    config.remarks,
                                    style = MaterialTheme.typography.bodyLarge,
                                    fontWeight = FontWeight.Medium
                                )
                                Text(
                                    "${config.server}:${config.serverPort}",
                                    style = MaterialTheme.typography.bodySmall,
                                    color = MaterialTheme.colorScheme.onSurfaceVariant
                                )
                                pingResult[config.guid]?.let { delay ->
                                    Text(
                                        if (delay >= 0) "پینگ: ${delay}ms" else "پینگ: ناموفق",
                                        style = MaterialTheme.typography.bodySmall,
                                        color = if (delay >= 0)
                                            MaterialTheme.colorScheme.primary
                                        else
                                            MaterialTheme.colorScheme.error
                                    )
                                }
                            }
                            IconButton(
                                onClick = {
                                    MmkvManager.removeServer(config.guid)
                                    configs = MmkvManager.decodeAllServerConfig().toList()
                                }
                            ) {
                                Icon(
                                    Icons.Default.Delete,
                                    contentDescription = "حذف",
                                    tint = MaterialTheme.colorScheme.error
                                )
                            }
                        }
                    }
                }
            }
        }

        if (showAddDialog) {
            AlertDialog(
                onDismissRequest = { showAddDialog = false },
                title = { Text("افزودن کانفیگ جدید") },
                text = {
                    OutlinedTextField(
                        value = newConfigText,
                        onValueChange = { newConfigText = it },
                        label = { Text("لینک کانفیگ (vless/vmess/ss)") },
                        modifier = Modifier.fillMaxWidth(),
                        minLines = 3
                    )
                },
                confirmButton = {
                    TextButton(
                        onClick = {
                            if (newConfigText.isNotBlank()) {
                                scope.launch {
                                    com.v2ray.ang.handler.AngConfigManager.importBatchConfig(
                                        newConfigText,
                                        "admin_added",
                                        append = true
                                    )
                                    configs = MmkvManager.decodeAllServerConfig().toList()
                                    newConfigText = ""
                                    showAddDialog = false
                                }
                            }
                        }
                    ) { Text("افزودن") }
                },
                dismissButton = {
                    TextButton(onClick = { showAddDialog = false }) {
                        Text("انصراف")
                    }
                }
            )
        }
    }
}

