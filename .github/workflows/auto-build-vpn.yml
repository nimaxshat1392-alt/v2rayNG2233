package com.v2ray.ang.handler

import com.v2ray.ang.dto.entities.ProfileItem
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.async
import kotlinx.coroutines.awaitAll
import kotlinx.coroutines.withContext
import java.net.InetSocketAddress
import java.net.Socket

object SpeedtestManager {

    suspend fun testAllServersPing(
        servers: List<ProfileItem>,
        onResult: (ProfileItem, Long) -> Unit
    ) = withContext(Dispatchers.IO) {
        val maxConcurrency = 10
        servers.chunked(maxConcurrency).forEach { chunk ->
            chunk.map { server ->
                async {
                    val delay = socketConnectTime(server.server, server.serverPort)
                    withContext(Dispatchers.Main) {
                        onResult(server, delay)
                    }
                }
            }.awaitAll()
        }
    }

    fun socketConnectTime(address: String, port: Int): Long {
        return try {
            val startTime = System.currentTimeMillis()
            val socket = Socket()
            socket.connect(InetSocketAddress(address, port), 2000)
            val endTime = System.currentTimeMillis()
            socket.close()
            endTime - startTime
        } catch (e: Exception) {
            -1L
        }
    }
}

