package com.v2ray.ang.handler

import android.content.Context
import android.content.Intent
import android.net.Uri
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

object AppUpdateChecker {

    private const val VERSION_URL =
        "https://raw.githubusercontent.com/nimaxshat1392-alt/v2rayNG2233/master/version.json"

    data class UpdateInfo(
        val latestVersion: String,
        val downloadUrl: String,
        val changelog: String
    )

    suspend fun checkForUpdate(currentVersion: String): UpdateInfo? = withContext(Dispatchers.IO) {
        try {
            val url = URL(VERSION_URL)
            val connection = url.openConnection() as HttpURLConnection
            connection.requestMethod = "GET"
            connection.connectTimeout = 10000

            val response = connection.inputStream.bufferedReader().readText()
            val json = JSONObject(response)
            val latestVersion = json.getString("version")
            val downloadUrl = json.getString("url")
            val changelog = json.getString("changelog")

            if (latestVersion != currentVersion) {
                UpdateInfo(latestVersion, downloadUrl, changelog)
            } else {
                null
            }
        } catch (e: Exception) {
            null
        }
    }

    fun openDownloadLink(context: Context, url: String) {
        val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))
        context.startActivity(intent)
    }
}

