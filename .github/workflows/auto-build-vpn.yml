package com.v2ray.ang.widget

import android.app.PendingIntent
import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.Context
import android.content.Intent
import android.widget.RemoteViews
import com.v2ray.ang.R
import com.v2ray.ang.service.V2RayVpnService

class VpnWidgetProvider : AppWidgetProvider() {

    override fun onUpdate(
        context: Context,
        appWidgetManager: AppWidgetManager,
        appWidgetIds: IntArray
    ) {
        appWidgetIds.forEach { widgetId ->
            val views = RemoteViews(context.packageName, R.layout.widget_vpn)

            views.setTextViewText(
                R.id.widget_status,
                if (V2RayVpnService.isRunning) "متصل" else "قطع"
            )

            val intent = Intent(context, V2RayVpnService::class.java).apply {
                action = if (V2RayVpnService.isRunning)
                    V2RayVpnService.ACTION_DISCONNECT
                else
                    V2RayVpnService.ACTION_CONNECT
            }

            val pendingIntent = PendingIntent.getService(
                context, 0, intent,
                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
            )

            views.setOnClickPendingIntent(R.id.widget_toggle, pendingIntent)

            appWidgetManager.updateAppWidget(widgetId, views)
        }
    }
}

