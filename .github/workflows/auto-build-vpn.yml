  توضیح: ثبت لاگ‌های حرفه‌ای برای دیباگ
════════════════════════════════════════════════════════════════

package com.v2ray.ang.util

import android.content.Context
import android.util.Log
import java.io.File
import java.text.SimpleDateFormat
import java.util.*

object Logger {

    private const val TAG = "VPN_Pro"
    private const val LOG_FILE = "vpn_pro.log"
    private var logFile: File? = null

    fun init(context: Context) {
        logFile = File(context.filesDir, LOG_FILE)
    }

    fun d(message: String) {
        Log.d(TAG, message)
        writeToFile("DEBUG", message)
    }

    fun e(message: String, throwable: Throwable? = null) {
        Log.e(TAG, message, throwable)
        writeToFile("ERROR", "$message\n${throwable?.stackTraceToString() ?: ""}")
    }

    fun i(message: String) {
        Log.i(TAG, message)
        writeToFile("INFO", message)
    }

    private fun writeToFile(level: String, message: String) {
        try {
            val sdf = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault())
            val logLine = "[${sdf.format(Date())}] [$level] $message\n"
            logFile?.appendText(logLine)
        } catch (e: Exception) {
            // نادیده بگیر
        }
    }

    fun getLogs(): String {
        return try {
            logFile?.readText() ?: ""
        } catch (e: Exception) {
            ""
        }
    }

    fun clearLogs() {
        try {
            logFile?.writeText("")
        } catch (e: Exception) {
            // نادیده بگیر
        }
    }
}

