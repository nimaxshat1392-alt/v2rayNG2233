════════════════════════════════════════════════════════════════

package com.v2ray.ang.handler

import android.content.Context
import com.v2ray.ang.dto.entities.ProfileItem
import org.json.JSONArray
import org.json.JSONObject

object SavedProfilesManager {

    private const val PREF_NAME = "saved_profiles"
    private const val KEY_PROFILES = "profiles"

    fun saveProfile(context: Context, profile: ProfileItem) {
        val profiles = getAllProfiles(context).toMutableList()
        profiles.removeAll { it.guid == profile.guid }
        profiles.add(profile)
        saveAll(context, profiles)
    }

    fun getAllProfiles(context: Context): List<ProfileItem> {
        val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
        val json = prefs.getString(KEY_PROFILES, "[]") ?: "[]"
        val list = mutableListOf<ProfileItem>()
        try {
            val arr = JSONArray(json)
            for (i in 0 until arr.length()) {
                val obj = arr.getJSONObject(i)
                list.add(
                    ProfileItem(
                        guid = obj.getString("guid"),
                        remarks = obj.getString("remarks"),
                        server = obj.getString("server"),
                        serverPort = obj.getInt("port")
                    )
                )
            }
        } catch (e: Exception) { }
        return list
    }

    fun deleteProfile(context: Context, guid: String) {
        val profiles = getAllProfiles(context).filterNot { it.guid == guid }
        saveAll(context, profiles)
    }

    private fun saveAll(context: Context, profiles: List<ProfileItem>) {
        val arr = JSONArray()
        profiles.forEach { p ->
            val obj = JSONObject().apply {
                put("guid", p.guid)
                put("remarks", p.remarks)
                put("server", p.server)
                put("port", p.serverPort)
            }
            arr.put(obj)
        }
        context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
            .edit()
            .putString(KEY_PROFILES, arr.toString())
            .apply()
    }
}

