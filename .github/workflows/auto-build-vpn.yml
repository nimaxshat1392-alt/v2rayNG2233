  توضیح: ثبت خودکار خطاها و ارسال به سرور شما
════════════════════════════════════════════════════════════════

package com.v2ray.ang.util

import android.content.Context
import android.os.Build
import java.io.PrintWriter
import java.io.StringWriter
import java.text.SimpleDateFormat
import java.util.*

object CrashReporter {

    private var crashCallback: ((String) -> Unit)? = null

    fun initialize(context: Context, onCrash: (String) -> Unit) {
        crashCallback = onCrash
        val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
        Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
            val report = buildCrashReport(context, throwable)
            onCrash(report)
            defaultHandler?.uncaughtException(thread, throwable)
        }
    }

    private fun buildCrashReport(context: Context, throwable: Throwable): String {
        val sw = StringWriter()
        throwable.printStackTrace(PrintWriter(sw))
        val stackTrace = sw.toString()

        val sdf = SimpleDateFormat("yyyy/MM/dd HH:mm:ss", Locale.getDefault())

        return """
            ═══ گزارش خطا ═══
            زمان: ${sdf.format(Date())}
            مدل: ${Build.MODEL}
            سازنده: ${Build.MANUFACTURER}
            اندروید: ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})
            بسته: ${context.packageName}

            ═══ جزئیات خطا ═══
            $stackTrace
        """.trimIndent()
    }
}

