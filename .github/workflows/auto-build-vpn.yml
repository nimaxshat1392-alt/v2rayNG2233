  مسیر: V2rayNG/app/src/main/java/com/v2ray/ang/handler/
  نام فایل: SubscriptionManager.kt
  توضیح: دریافت خودکار کانفیگ از لینک اشتراک
════════════════════════════════════════════════════════════════

package com.v2ray.ang.handler

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import java.net.HttpURLConnection
import java.net.URL
import java.util.Base64

object SubscriptionManager {

    suspend fun fetchSubscription(url: String): String? = withContext(Dispatchers.IO) {
        try {
            val conn = URL(url).openConnection() as HttpURLConnection
            conn.connectTimeout = 15000
            conn.readTimeout = 15000
            conn.setRequestProperty("User-Agent", "VPN-Pro/1.0")
            val response = conn.inputStream.bufferedReader().readText()

            if (!response.contains("://")) {
                try {
                    String(Base64.getDecoder().decode(response.trim()))
                } catch (e: Exception) {
                    response
                }
            } else {
                response
            }
        } catch (e: Exception) {
            null
        }
    }

    suspend fun updateFromSubscription(subId: String, url: String): Boolean {
        val content = fetchSubscription(url) ?: return false
        MmkvManager.removeServerViaSubid(subId)
        return AngConfigManager.importBatchConfig(content, subId, append = false)
    }
}

