@Composable
fun AdvancedSettingsScreen(
    onBack: () -> Unit
) {
    var dnsServer by remember { mutableStateOf("1.1.1.1") }
    var mtuSize by remember { mutableStateOf("1500") }
    var enableFragmentation by remember { mutableStateOf(true) }
    var enableMux by remember { mutableStateOf(false) }
    var muxConcurrency by remember { mutableStateOf("8") }
    var enableSniffing by remember { mutableStateOf(true) }
