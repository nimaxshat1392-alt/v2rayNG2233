package com.v2ray.ang.service

import android.content.Intent
import android.graphics.drawable.Icon
import android.service.quicksettings.Tile
import android.service.quicksettings.TileService
import com.v2ray.ang.R

class VpnTileService : TileService() {

    override fun onStartListening() {
        super.onStartListening()
        val tile = qsTile ?: return
        tile.state = if (V2RayVpnService.isRunning) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
        tile.label = "VPN"
        tile.icon = Icon.createWithResource(this, R.drawable.ic_stat_vpn)
        tile.updateTile()
    }

    override fun onClick() {
        super.onClick()
        val intent = Intent(this, V2RayVpnService::class.java)
        if (V2RayVpnService.isRunning) {
            intent.action = V2RayVpnService.ACTION_DISCONNECT
        } else {
            intent.action = V2RayVpnService.ACTION_CONNECT
        }
        startService(intent)

        val tile = qsTile ?: return
        tile.state = if (V2RayVpnService.isRunning) Tile.STATE_INACTIVE else Tile.STATE_ACTIVE
        tile.updateTile()
    }
}

