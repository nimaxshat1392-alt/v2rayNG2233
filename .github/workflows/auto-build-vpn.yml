package com.v2ray.ang.handler

import com.v2ray.ang.dto.entities.ProfileItem
import com.v2ray.ang.util.MmkvManager
import org.json.JSONArray
import org.json.JSONObject
import java.text.SimpleDateFormat
import java.util.*

object SpeedHistoryManager {

    private const val HISTORY_KEY = "speed_history"

    data class SpeedRecord(
        val serverName: String,
        val ping: Long,
        val timestamp: Long,
        val downloadSpeed: String,
        val uploadSpeed: String
    )

    fun saveRecord(server: ProfileItem, ping: Long, download: String, upload: String) {
        val history = getHistory().toMutableList()
        history.add(
            SpeedRecord(
                serverName = server.remarks,
                ping = ping,
                timestamp = System.currentTimeMillis(),
                downloadSpeed = download,
                uploadSpeed = upload
            )
        )
        if (history.size > 50) {
            history.removeAt(0)
        }
        saveHistory(history)
    }

    fun getHistory(): List<SpeedRecord> {
        val json = MmkvManager.decodeSettings(HISTORY_KEY, "[]")
        val list = mutableListOf<SpeedRecord>()
        try {
            val array = JSONArray(json)
            for (i in 0 until array.length()) {
                val obj = array.getJSONObject(i)
                list.add(
                    SpeedRecord(
                        serverName = obj.getString("serverName"),
                        ping = obj.getLong("ping"),
                        timestamp = obj.getLong("timestamp"),
                        downloadSpeed = obj.getString("downloadSpeed"),
                        uploadSpeed = obj.getString("uploadSpeed")
                    )
                )
            }
        } catch (e: Exception) {
            e.printStackTrace()
        }
        return list
    }

    private fun saveHistory(history: List<SpeedRecord>) {
        val array = JSONArray()
        history.forEach { record ->
            val obj = JSONObject().apply {
                put("serverName", record.serverName)
                put("ping", record.ping)
                put("timestamp", record.timestamp)
                put("downloadSpeed", record.downloadSpeed)
                put("uploadSpeed", record.uploadSpeed)
            }
            array.put(obj)
        }
        MmkvManager.encodeSettings(HISTORY_KEY, array.toString())
    }

    fun formatTimestamp(timestamp: Long): String {
        val sdf = SimpleDateFormat("yyyy/MM/dd HH:mm", Locale.getDefault())
        return sdf.format(Date(timestamp))
    }
}

